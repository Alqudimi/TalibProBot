services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academic}
      POSTGRES_USER: ${POSTGRES_USER:-academic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: $${POSTGRES_DB:-academic}
      POSTGRES_USER: $${POSTGRES_USER:-academic}
      DATABASE_URL: postgresql+asyncpg://$${POSTGRES_USER:-academic}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB:-academic}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      BOT_POLLING_ENABLED: "true"
      TASK_WORKER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: $${POSTGRES_DB:-academic}
      POSTGRES_USER: $${POSTGRES_USER:-academic}
      DATABASE_URL: postgresql+asyncpg://$${POSTGRES_USER:-academic}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB:-academic}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      BOT_POLLING_ENABLED: "false"
      TASK_WORKER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
