# Requires a real Telegram test user session and a dedicated test bot.
# Run with: /home/ubuntu/tgtest-venv/bin/tgtest run tests/e2e/scenarios/public_user.yaml --env tests/e2e/.env.tgtest

name: Public user - onboarding and main navigation
steps:
  - command: start
  - expect:
      has_buttons: true
  - click: "📄 قراءة الشروط"
  - expect:
      contains: "الشروط"
  - command: terms
  - expect:
      has_buttons: true
  - command: help
  - expect:
      has_buttons: true
  - command: menu
  - expect:
      buttons: ["📚 الخدمات", "🗂️ طلباتي", "🧪 مركز المذاكرة", "🎧 الدعم"]
  - click: "📚 الخدمات"
  - expect:
      has_buttons: true
  - click: "🏠 الرئيسية"
  - expect:
      has_buttons: true
