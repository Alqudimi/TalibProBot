name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d academic"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Initialize schema
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d academic -f database.sql
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: Diff check
        run: git diff --check
      - name: Tests
        env:
          BOT_TOKEN: 1234567890:ci_test_token_xxxxxxxx
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/academic
          POSTGRES_SCHEMA: student_platform
        run: uv run pytest -q

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: talibprobot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
